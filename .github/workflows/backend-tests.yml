name: Backend Unit Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'mise.toml'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - 'mise.toml'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

jobs:
  unit-tests:
    name: Backend ruff + pytest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install tools (python, uv) with mise
        uses: jdx/mise-action@v2
      - name: Lint (ruff)
        run: mise run lint:backend
      - name: Run unit tests
        run: mise run test:backend:unit
      - name: Run integration tests
        run: mise run test:backend:integration
