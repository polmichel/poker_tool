name: E2E Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      # Start PostgreSQL service (if needed, currently using SQLite)
      # postgres:
      #   image: postgres:15
      #   env:
      #     POSTGRES_PASSWORD: postgres
      #     POSTGRES_USER: postgres
      #     POSTGRES_DB: poker_tool_test
      #   ports:
      #     - 5432:5432
      #   options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install backend dependencies
      working-directory: backend
      run: |
        pip install -q Flask Flask-CORS Flask-SQLAlchemy Flask-JWT-Extended python-dotenv Werkzeug

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Install Playwright browsers
      working-directory: frontend
      run: npx playwright install --with-deps

    # Start backend server in background
    - name: Start backend server
      working-directory: backend
      run: |
        # Create instance directory
        mkdir -p instance
        # Start Flask server in background
        python3 main.py > /tmp/backend.log 2>&1 &
        BACKEND_PID=$!
        echo "Backend PID: $BACKEND_PID" >> $GITHUB_ENV
        
        # Wait for backend to be ready
        for i in {1..30}; do
          if curl -s http://localhost:5000/api/health > /dev/null; then
            echo "Backend is ready!"
            break
          fi
          sleep 2
          echo "Waiting for backend... ($i/30)"
        done
        
        # Create test data
        python3 -c "
import sys
sys.path.insert(0, '.')
from app import create_app
from database import db, User, RangeModel
from models.range import RangeType, Position

app = create_app()
with app.app_context():
    db.create_all()
    
    # Create test user
    user = User.query.filter_by(username='testuser').first()
    if not user:
        user = User(username='testuser', email='test@test.com')
        db.session.add(user)
        db.session.commit()
        print(f'User created: ID={user.id}')
    
    # Create test range with hands
    range_obj = RangeModel.query.filter_by(name='Test Range E2E').first()
    if not range_obj:
        range_obj = RangeModel(
            name='Test Range E2E',
            description='Range de test pour E2E',
            range_type=RangeType.PREFLOP,
            position=Position.BTN,
            hands={'AA': 'raise', 'KK': 'raise', 'QQ': 'raise', 'AKs': 'raise', 'JJ': 'call', 'TT': 'call', 'AQs': 'raise', 'KQs': 'call'},
            user_id=user.id
        )
        db.session.add(range_obj)
        db.session.commit()
        print(f'Range created: ID={range_obj.id}')
    
    # Verify
    all_ranges = RangeModel.query.all()
    print(f'Total ranges: {len(all_ranges)}')
        " > /tmp/create_test_data.log 2>&1

    - name: Start frontend server
      working-directory: frontend
      run: |
        # Start React dev server in background
        PORT=3000 BROWSER=none npm start > /tmp/frontend.log 2>&1 &
        FRONTEND_PID=$!
        echo "Frontend PID: $FRONTEND_PID" >> $GITHUB_ENV
        
        # Wait for frontend to be ready
        for i in {1..30}; do
          if curl -s http://localhost:3000 > /dev/null; then
            echo "Frontend is ready!"
            break
          fi
          sleep 2
          echo "Waiting for frontend... ($i/30)"
        done

    - name: Run CI basic tests
      working-directory: frontend
      run: npx playwright test tests/e2e/specs/ci-basic.spec.ts
      env:
        BASE_URL: http://localhost:3000
        CI: true

    - name: Run questionnaire tests
      working-directory: frontend
      run: npx playwright test tests/e2e/specs/questionnaire.spec.ts
      env:
        BASE_URL: http://localhost:3000
        CI: true

    - name: Run create range tests
      working-directory: frontend
      run: npx playwright test tests/e2e/specs/create-range.spec.ts
      env:
        BASE_URL: http://localhost:3000
        CI: true

    - name: Stop servers
      if: always()
      run: |
        # Stop backend
        pkill -f "python3 main.py" || true
        # Stop frontend
        pkill -f "npm start" || true
        pkill -f "node.*react-scripts" || true

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: frontend/playwright-report/
        retention-days: 30

    - name: Upload test artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: frontend/test-results/
        retention-days: 30
